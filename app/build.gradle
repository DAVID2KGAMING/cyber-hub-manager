plugins { id 'com.android.application' }
android {
    namespace 'david.manager'
    compileSdk 34
    buildToolsVersion '35.0.0'
    signingConfigs { development { storeFile file('src/main/assets/development-signing.p12'); storePassword 'cyberhub-development'; keyAlias 'cyberhub-dev'; keyPassword 'cyberhub-development'; storeType 'PKCS12' } }
    buildTypes { debug { signingConfig signingConfigs.development } }
    defaultConfig { applicationId 'david.manager'; minSdk 26; targetSdk 34; versionCode 10; versionName '0.1.9' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/INDEX.LIST','META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA','META-INF/versions/**']; pickFirsts += ['META-INF/LICENSE*','META-INF/NOTICE*'] } }
}
dependencies { implementation fileTree(dir: 'libs', include: ['*.jar']) }
